[tool:pytest]
# Directorio raíz de tests Django
testpaths = gestion/tests inventory/tests internal_api/tests
python_files = test_*.py tests_*.py
python_classes = Test*
python_functions = test_*

# Django settings para el runner de pytest-django
DJANGO_SETTINGS_MODULE = TexCore.settings_test

# Cobertura: la única configuración es .coveragerc (fail_under = 90, la que usa el CI).
# Aquí no se duplica: con .coveragerc presente coverage.py ignora las secciones
# [coverage:*] de este archivo, y un umbral distinto (antes 89) solo inducía a error.


[tool:pytest]
# Directorio raíz de tests Django
testpaths = gestion/tests inventory/tests internal_api/tests
python_files = test_*.py tests_*.py
python_classes = Test*
python_functions = test_*

# Django settings para el runner de pytest-django
DJANGO_SETTINGS_MODULE = TexCore.settings_test

[coverage:run]
# Alias — .coveragerc es la fuente principal; esta sección es por compatibilidad
source = gestion, inventory, internal_api
omit =
    */migrations/*
    */tests/*

[coverage:report]
fail_under = 89
show_missing = true


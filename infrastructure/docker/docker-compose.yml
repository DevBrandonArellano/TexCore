services:
  db:
    build: ../../database
    # Límites de recursos ajustables por máquina — ver DB_CPUS/DB_MEMORY_LIMIT_MB
    # en .env (no editar estos valores aquí, cambiar el .env de cada entorno).
    cpus: ${DB_CPUS:-2}
    mem_limit: ${DB_MEMORY_LIMIT_MB:-4096}m
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Developer
      # SQL Server debe saber que tiene el MISMO límite que le puso Docker
      # arriba (mem_limit) — si no, intenta reservar más RAM de la que
      # existe y el contenedor queda "atorado" (encontrado en la auditoría
      # de performance del 2026-08-31: sin este valor, SQL Server se quedaba
      # pegado a ~4GB de forma constante, sin margen para el resto del stack).
      - MSSQL_MEMORY_LIMIT_MB=${DB_MEMORY_LIMIT_MB:-4096}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD}' -C -N -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
    restart: on-failure
    # CPUs ajustables por máquina — ver BACKEND_CPUS/BACKEND_WORKERS en .env.
    cpus: ${BACKEND_CPUS:-2}
    # gunicorn en vez de 'runserver': mismo mecanismo que producción
    # (docker-compose.prod.yml + Dockerfile.prod), así que una prueba de
    # carga en dev refleja lo que va a pasar en producción. '--reload' imita
    # el autoreload de 'runserver' para no perder la comodidad de desarrollo.
    # BACKEND_WORKERS controla cuántos procesos worker levanta — regla
    # general (2 x BACKEND_CPUS) + 1 (ver auditoría de performance
    # 2026-08-31: con solo 3 workers colapsó bajo 100 usuarios concurrentes).
    command: sh /app/infrastructure/docker/entrypoint.sh gunicorn --reload --workers ${BACKEND_WORKERS:-3} --bind 0.0.0.0:8000 --timeout 120 TexCore.wsgi:application
    volumes:
      - ../../:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=insecure-dev-key
      - DEBUG=True
      - DB_ENGINE=mssql
      - DB_NAME=texcore_db
      - DB_USER=sa
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=1433
      - DB_DRIVER=ODBC Driver 18 for SQL Server
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - REPORTING_SERVICE_URL=http://reporting_excel:8002
      - PRINTING_SERVICE_URL=http://printing:8001
      - TRAZABILIDAD_BASE_URL=${TRAZABILIDAD_BASE_URL:-http://localhost/trazabilidad}
      - INTERNAL_JWT_PRIVATE_KEY=${INTERNAL_JWT_PRIVATE_KEY}
      - INTERNAL_JWT_PUBLIC_KEY=${INTERNAL_JWT_PUBLIC_KEY}
      - SCANNING_SERVICE_SECRET=${SCANNING_SERVICE_SECRET:-scanning-dev-secret}
      - REPORTING_SERVICE_SECRET=${REPORTING_SERVICE_SECRET:-reporting-dev-secret}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8000)); s.close()\""]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 120s

  # Escaneo: requerido por nginx.conf (location /api/scanning/)
  # v3.0: sin acceso a BD — consume Django Internal API via JWT RS256
  scanning:
    build:
      context: ../../scanning_service
      dockerfile: Dockerfile
    environment:
      - DJANGO_INTERNAL_URL=http://backend:8000
      - SERVICE_NAME=scanning_service
      - SERVICE_SECRET=${SCANNING_SERVICE_SECRET:-scanning-dev-secret}
      - INTERNAL_JWT_PUBLIC_KEY=${INTERNAL_JWT_PUBLIC_KEY}
      - AUDIT_DB_PATH=/data/logs.db
    volumes:
      - scanning_audit_data:/data
    expose:
      - "8000"
    depends_on:
      backend:
        condition: service_healthy

  # Punto de entrada http://localhost/ → /api/* al backend (misma red Docker que `backend:8000`)
  nginx:
    build:
      context: ../../
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      scanning:
        condition: service_started

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.dev
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  printing:
    build:
      context: ../../printing_service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - AUDIT_DB_PATH=/data/logs.db
    volumes:
      - ../../printing_service/src:/app/src
      - printing_audit_data:/data

  # v2.0: sin acceso a BD — consume Django Internal API via JWT RS256
  reporting_excel:
    build:
      context: ../../reporting_excel
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ../../reporting_excel/src:/app/src
      - reporting_audit_data:/data
    environment:
      # DJANGO_INTERNAL_URL solo se usa para el healthcheck (GET /api/health/)
      # — este servicio ya no llama a Django para consultar datos de reportes
      # (auditoría de performance 2026-08-31: el backend le manda los datos
      # ya resueltos a POST /generate, sin salto de vuelta).
      - DJANGO_INTERNAL_URL=http://backend:8000
      - INTERNAL_JWT_PUBLIC_KEY=${INTERNAL_JWT_PUBLIC_KEY}
      - CORS_ALLOWED_ORIGINS=http://backend:8000
      - AUDIT_DB_PATH=/data/logs.db
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"

  celery_worker:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile
    restart: on-failure
    command: sh /app/infrastructure/docker/entrypoint.sh celery -A TexCore worker -l INFO
    volumes:
      - ../../:/app
    environment:
      - SECRET_KEY=insecure-dev-key
      - DEBUG=True
      - DB_ENGINE=mssql
      - DB_NAME=texcore_db
      - DB_USER=sa
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=1433
      - DB_DRIVER=ODBC Driver 18 for SQL Server
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - INTERNAL_JWT_PRIVATE_KEY=${INTERNAL_JWT_PRIVATE_KEY}
      - INTERNAL_JWT_PUBLIC_KEY=${INTERNAL_JWT_PUBLIC_KEY}
      - SCANNING_SERVICE_SECRET=${SCANNING_SERVICE_SECRET:-scanning-dev-secret}
      - REPORTING_SERVICE_SECRET=${REPORTING_SERVICE_SECRET:-reporting-dev-secret}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mssql_data:
  frontend_node_modules:
  scanning_audit_data:
  printing_audit_data:
  reporting_audit_data:

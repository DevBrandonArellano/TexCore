# docker-compose.prod.yml

services:
  db:
    build:
      context: ../../
      dockerfile: database/Dockerfile
    dns:
      - 8.8.8.8
    # Límites de recursos ajustables por servidor — ver DB_CPUS/
    # DB_MEMORY_LIMIT_MB en .env (no editar estos valores aquí).
    cpus: ${DB_CPUS:-2}
    mem_limit: ${DB_MEMORY_LIMIT_MB:-4096}m
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Developer
      # Debe coincidir con mem_limit de arriba — si SQL Server cree que
      # tiene más RAM de la que Docker le da, queda "atorado" (ver
      # auditoría de performance 2026-08-31).
      - MSSQL_MEMORY_LIMIT_MB=${DB_MEMORY_LIMIT_MB:-4096}
    restart: always
    expose:
      - "1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD}' -C -N -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  backend:
    image: ${CI_REGISTRY_IMAGE}/backend:${TAG}
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.prod
    restart: always
    user: appuser
    # CPU/RAM ajustables por servidor — ver BACKEND_CPUS/BACKEND_MEMORY_LIMIT_MB/
    # BACKEND_WORKERS en .env. Sin mem_limit, cada worker gunicorn adicional
    # crece la RSS del contenedor sin techo — al afinar BACKEND_WORKERS al
    # mínimo viable (auditoría de performance 2026-08-31) hace falta este
    # límite para no reventar la RAM real del servidor.
    cpus: ${BACKEND_CPUS:-2}
    mem_limit: ${BACKEND_MEMORY_LIMIT_MB:-2048}m
    # Sobreescribe el CMD fijo de Dockerfile.prod (gunicorn --workers 3) con
    # uno parametrizado. Regla general para BACKEND_WORKERS:
    # (2 x BACKEND_CPUS) + 1 — con 3 workers colapsó bajo 100 usuarios
    # concurrentes en la prueba de carga (scripts/loadtest/), ver auditoría
    # de performance 2026-08-31.
    command: gunicorn --workers ${BACKEND_WORKERS:-3} --bind 0.0.0.0:8000 --timeout 120 TexCore.wsgi:application
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=0
      - DB_ENGINE=mssql
      - DB_NAME=texcore_db
      - DB_USER=sa
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=1433
      - DB_DRIVER=ODBC Driver 18 for SQL Server
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - STATIC_ROOT=/home/appuser/app/staticfiles
      - REPORTING_SERVICE_URL=http://reporting_excel:8002
      - PRINTING_SERVICE_URL=http://printing:8001
      - TRAZABILIDAD_BASE_URL=${TRAZABILIDAD_BASE_URL}
      - INTERNAL_JWT_PRIVATE_KEY=${INTERNAL_JWT_PRIVATE_KEY}
      - INTERNAL_JWT_PUBLIC_KEY=${INTERNAL_JWT_PUBLIC_KEY}
      - SCANNING_SERVICE_SECRET=${SCANNING_SERVICE_SECRET}
      - REPORTING_SERVICE_SECRET=${REPORTING_SERVICE_SECRET}
    volumes:
      - prod_django_static:/home/appuser/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: ${CI_REGISTRY_IMAGE}/nginx:${TAG}
    build:
      context: ../../
      dockerfile: nginx/Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../nginx/certs:/etc/nginx/certs:ro
      - prod_django_static:/var/www/django_static:ro
    depends_on:
      - backend

  printing:
    image: ${CI_REGISTRY_IMAGE}/printing_service:${TAG}
    build:
      context: ../../printing_service
      dockerfile: Dockerfile
    restart: always
    environment:
      # Sin este volumen/env, engine.py (default /data/logs.db) falla al
      # arrancar con "unable to open database file" — /data no existe en la
      # imagen (a diferencia de scanning_service, que sí lo crea en su
      # Dockerfile). Encontrado corriendo este compose por primera vez
      # localmente (auditoría de performance 2026-08-31).
      - AUDIT_DB_PATH=/data/logs.db
    volumes:
      - printing_audit_data:/data
    expose:
      - "8001"

  scanning:
    image: ${CI_REGISTRY_IMAGE}/scanning_service:${TAG}
    build:
      context: ../../scanning_service
      dockerfile: Dockerfile
    restart: always
    environment:
      - DJANGO_INTERNAL_URL=http://backend:8000
      - SERVICE_NAME=scanning_service
      - SERVICE_SECRET=${SCANNING_SERVICE_SECRET}
      - INTERNAL_JWT_PUBLIC_KEY=${INTERNAL_JWT_PUBLIC_KEY}
      # El Dockerfile de scanning_service sí crea /data (mkdir -p /data), así
      # que arranca sin este volumen — pero sin él el audit log de seguridad
      # vive en la capa writable del contenedor y se pierde en cada
      # redeploy. Se monta igual que en dev para persistirlo.
      - AUDIT_DB_PATH=/data/logs.db
    volumes:
      - scanning_audit_data:/data
    expose:
      - "8000"
    depends_on:
      backend:
        condition: service_started

  reporting_excel:
    image: ${CI_REGISTRY_IMAGE}/reporting_excel:${TAG}
    build:
      context: ../../reporting_excel
      dockerfile: Dockerfile
    restart: always
    environment:
      # DJANGO_INTERNAL_URL solo se usa para el healthcheck (GET /api/health/)
      # — este servicio ya no llama a Django para consultar datos de reportes
      # (auditoría de performance 2026-08-31: el backend le manda los datos
      # ya resueltos a POST /generate, sin salto de vuelta).
      - DJANGO_INTERNAL_URL=http://backend:8000
      - INTERNAL_JWT_PUBLIC_KEY=${INTERNAL_JWT_PUBLIC_KEY}
      - CORS_ALLOWED_ORIGINS=http://backend:8000
      # Mismo problema que printing: sin esto, engine.py falla al arrancar
      # porque /data no existe en la imagen.
      - AUDIT_DB_PATH=/data/logs.db
    volumes:
      - reporting_audit_data:/data
    expose:
      - "8002"
    depends_on:
      backend:
        condition: service_started

volumes:
  mssql_data:
  prod_django_static:
  printing_audit_data:
  scanning_audit_data:
  reporting_audit_data:

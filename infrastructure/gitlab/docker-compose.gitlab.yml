# =============================================================================
# TEXCORE — GITLAB CE AUTOALOJADO (CI/CD, Container Registry y runners)
# La tesis (§5.3) define el pipeline en GitLab CI y las imágenes en el GitLab Container
# Registry. Corre en el mismo equipo que el staging, dentro de la red de Interfibra.
# Guía: docs/arquitectura/GUIA_GITLAB.md · Decisión: ADR-014.
#
# Uso, desde la raíz del repositorio:
#   bash infrastructure/gitlab/generar_certificado.sh 192.168.1.55
#   docker compose -f infrastructure/gitlab/docker-compose.gitlab.yml --env-file infrastructure/gitlab/.env up -d --wait
# =============================================================================
name: texcore-gitlab

services:
  gitlab:
    # Versión y digest fijos: una actualización se hace a propósito (ver la guía).
    image: gitlab/gitlab-ce:19.4.3-ce.0@sha256:483fb4cc5c75237a7a6c7c8b8b2a1832ed790d86e0449ff55e8b6f6d62d2d5f5
    restart: unless-stopped
    hostname: ${GITLAB_HOST:-192.168.1.55}
    shm_size: 256m
    ports:
      - "${GITLAB_HTTPS_PORT:-8929}:${GITLAB_HTTPS_PORT:-8929}"
      - "${GITLAB_REGISTRY_PORT:-5050}:${GITLAB_REGISTRY_PORT:-5050}"
      - "${GITLAB_SSH_PORT:-2224}:22"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://${GITLAB_HOST:-192.168.1.55}:${GITLAB_HTTPS_PORT:-8929}'
        registry_external_url 'https://${GITLAB_HOST:-192.168.1.55}:${GITLAB_REGISTRY_PORT:-5050}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2224}
        # Certificado propio (infrastructure/gitlab/certs, fuera de git).
        nginx['ssl_certificate'] = '/etc/gitlab/ssl/gitlab.crt'
        nginx['ssl_certificate_key'] = '/etc/gitlab/ssl/gitlab.key'
        registry_nginx['ssl_certificate'] = '/etc/gitlab/ssl/gitlab.crt'
        registry_nginx['ssl_certificate_key'] = '/etc/gitlab/ssl/gitlab.key'
        # El equipo comparte memoria con el stack de TexCore (16 GB): se acota GitLab.
        # 0 = modo single de Puma: sin workers extra (cada uno ~1 GiB de Rails).
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 5
        # KAS (agente de Kubernetes) no se usa: se desactiva para liberar ~90 MiB.
        gitlab_kas['enable'] = false
        postgresql['shared_buffers'] = '256MB'
        prometheus_monitoring['enable'] = false
        # Respaldo diario por cron del contenedor y retención de 7 días.
        gitlab_rails['backup_keep_time'] = 604800
        gitlab_rails['backup_path'] = '/var/opt/gitlab/backups'
        # Sin registro abierto: las cuentas las crea el administrador. Este valor solo rige en el
        # primer arranque; en una instalación existente se cierra en Admin > Settings (GUIA_GITLAB §2).
        gitlab_rails['gitlab_signup_enabled'] = false
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
      - ./certs:/etc/gitlab/ssl:ro
    deploy:
      resources:
        limits:
          memory: 6g
    healthcheck:
      test: ["CMD", "/opt/gitlab/bin/gitlab-healthcheck", "--fail", "--max-time", "10"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 300s

  # Runner de integración: ejecutor Docker. Los jobs NO reciben el socket del host.
  runner-ci:
    image: gitlab/gitlab-runner:v19.5.1@sha256:8e049fb719162488893a9eccc48f3a05259d02f2386dfbb20f3e379a50575afd
    restart: unless-stopped
    depends_on:
      gitlab:
        condition: service_healthy
    volumes:
      - runner_ci_config:/etc/gitlab-runner
      - ./certs:/etc/gitlab-runner/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock

  # Runner de release y staging: solo ramas protegidas. Los jobs reciben el socket del
  # host para construir y levantar el staging efímero, y usan la red del host.
  runner-staging:
    image: gitlab/gitlab-runner:v19.5.1@sha256:8e049fb719162488893a9eccc48f3a05259d02f2386dfbb20f3e379a50575afd
    restart: unless-stopped
    depends_on:
      gitlab:
        condition: service_healthy
    volumes:
      - runner_staging_config:/etc/gitlab-runner
      - ./certs:/etc/gitlab-runner/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  runner_ci_config:
  runner_staging_config:

# =============================================================================
# TexCore — Release y despliegue a producción
#
# Se activa con cada push a master (el merge del PR staging → master):
#   ci (completo) → build desde cero de las 6 imágenes → Trivy → staging efímero con
#   pruebas de humo → aprobación del environment "production" → deploy desde el runner
#   propio del servidor (respaldo → migraciones → servicios) → notificación.
#
# Cada imagen se construye UNA vez, sin caché y con las bases actualizadas, sobre el
# commit exacto de master; desde ahí todo usa su digest: es la misma que se escanea,
# se prueba en staging, se firma y se despliega (SLSA: procedencia atestiguada + firma
# keyless de Sigstore, verificada en el servidor antes del deploy).
#
# Configuración en GitHub (Settings → Secrets and variables → Actions → Variables):
#   PRODUCCION_HOST — dominio o IP del servidor (URL del environment)
#   TEXCORE_DIR     — directorio del servidor con .env.prod, nginx/certs y respaldos/
# Secreto opcional: DEPLOY_NOTIFY_WEBHOOK (Slack/Teams).
# Runner: self-hosted con la etiqueta `texcore-prod` (docs/arquitectura/GUIA_DESPLIEGUE.md §5).
# Los secretos de la aplicación no pasan por GitHub: viven en .env.prod del servidor.
# =============================================================================

name: TexCore Release

on:
  push:
    branches: [master]

# Mínimo privilegio: cada job declara solo lo que usa.
permissions: {}

# Los despliegues no se cancelan entre sí: el siguiente espera al anterior.
concurrency:
  group: release-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/texcore

jobs:
  # ===========================================================================
  # CI COMPLETO sobre el commit de master
  # ===========================================================================
  ci:
    name: "CI · master"
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ===========================================================================
  # BUILD — desde cero, publicación por digest, procedencia y firma
  # ===========================================================================
  build:
    name: "Build · ${{ matrix.service.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: ci
    permissions:
      contents: read
      packages: write # push a GHCR
      id-token: write # OIDC para la firma keyless y la atestación
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        service:
          # servicio: nombre en el compose; name: nombre de la imagen
          - { name: db, servicio: db, dockerfile: database/Dockerfile, context: . }
          - { name: backend, servicio: backend, dockerfile: infrastructure/docker/Dockerfile.prod, context: . }
          - { name: nginx, servicio: nginx, dockerfile: nginx/Dockerfile, context: . }
          - { name: printing_service, servicio: printing, dockerfile: printing_service/Dockerfile, context: printing_service }
          - { name: scanning_service, servicio: scanning, dockerfile: scanning_service/Dockerfile, context: scanning_service }
          - { name: reporting_excel, servicio: reporting_excel, dockerfile: reporting_excel/Dockerfile, context: reporting_excel }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Autenticar en GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build y push — ${{ matrix.service.name }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          no-cache: true # desde cero: nada de capas de otra rama
          pull: true # bases actualizadas (los FROM están fijados por digest)
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/${{ matrix.service.name }}:latest
          labels: |
            org.opencontainers.image.title=TexCore ${{ matrix.service.name }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true

      - name: Atestación de procedencia (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_BASE }}/${{ matrix.service.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Instalar cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Firma keyless (Sigstore)
        env:
          REFERENCIA: ${{ env.IMAGE_BASE }}/${{ matrix.service.name }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REFERENCIA"

      - name: Registrar el digest
        env:
          SERVICIO: ${{ matrix.service.servicio }}
          REFERENCIA: ${{ env.IMAGE_BASE }}/${{ matrix.service.name }}@${{ steps.build.outputs.digest }}
        run: echo "$SERVICIO=$REFERENCIA" > "imagen-$SERVICIO.env"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imagen-${{ matrix.service.servicio }}
          path: imagen-${{ matrix.service.servicio }}.env
          retention-days: 90

  # ===========================================================================
  # IMÁGENES — une los 6 digests en imagenes.env (lo usan scan, staging y deploy)
  # ===========================================================================
  imagenes:
    name: "Imágenes · lista de digests"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: imagen-*
          merge-multiple: true
      - name: Unir los digests
        run: |
          cat imagen-*.env > imagenes.env
          cat imagenes.env
          test "$(wc -l < imagenes.env)" -eq 6
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imagenes
          path: imagenes.env
          retention-days: 90

  # ===========================================================================
  # SCAN — Trivy sobre las 6 imágenes, por digest
  # ISO/IEC 27001 A.12.6.1 — CVEs CRITICAL/HIGH bloquean el release
  # ===========================================================================
  scan:
    name: "Scan · Trivy (${{ matrix.servicio }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: imagenes
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # backend y nginx: gate estricto. db y satélites: `ignore-unfixed` — bloquean los
        # CRITICAL/HIGH con parche publicado; los CVE de paquetes base sin parche no son
        # corregibles por el equipo y siguen visibles en el SARIF.
        include:
          - { servicio: backend, ignore_unfixed: false }
          - { servicio: nginx, ignore_unfixed: false }
          - { servicio: db, ignore_unfixed: true }
          - { servicio: reporting_excel, ignore_unfixed: true }
          - { servicio: printing, ignore_unfixed: true }
          - { servicio: scanning, ignore_unfixed: true }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imagenes
      - name: Referencia por digest
        env:
          SERVICIO: ${{ matrix.servicio }}
        run: echo "REFERENCIA=$(grep "^$SERVICIO=" imagenes.env | cut -d= -f2-)" >> "$GITHUB_ENV"
      - name: Autenticar en GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy — escaneo bloqueante
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0 # binario de Trivy fijado (CVE-2026-33634: no usar latest)
          image-ref: ${{ env.REFERENCIA }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: ${{ matrix.ignore_unfixed }}
          exit-code: "1"
      - name: Trivy — reporte SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ env.REFERENCIA }}
          format: sarif
          output: trivy-${{ matrix.servicio }}.sarif
          severity: CRITICAL,HIGH,MEDIUM
      - name: Publicar en GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-${{ matrix.servicio }}.sarif
          category: trivy-${{ matrix.servicio }}

  # ===========================================================================
  # STAGING EFÍMERO — las 6 imágenes + SQL Server desechable + pruebas de humo
  # Si falla, no se pide aprobación ni se despliega.
  # ===========================================================================
  staging:
    name: "Staging efímero · pruebas de humo"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [imagenes, scan]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imagenes
      - name: Autenticar en GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Levantar, migrar desde cero y probar
        run: bash scripts/staging_efimero.sh imagenes.env

  # ===========================================================================
  # DEPLOY — runner propio del servidor, con aprobación del environment
  # ===========================================================================
  deploy:
    name: "Deploy · producción"
    runs-on: [self-hosted, texcore-prod]
    timeout-minutes: 45
    needs: [imagenes, staging]
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://${{ vars.PRODUCCION_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imagenes
      - name: Autenticar en GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Instalar cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verificar la firma de las 6 imágenes
        env:
          IDENTIDAD: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@refs/heads/master
        run: |
          while IFS='=' read -r servicio referencia; do
            echo "Verificando $servicio: $referencia"
            cosign verify --certificate-identity "$IDENTIDAD" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$referencia" > /dev/null
          done < imagenes.env
      - name: Respaldo, migraciones y servicios
        env:
          TEXCORE_DIR: ${{ vars.TEXCORE_DIR }}
        run: bash scripts/desplegar_release.sh imagenes.env
      - name: Verificar salud
        run: |
          for intento in $(seq 1 15); do
            if curl -skf --max-time 8 https://localhost/api/health/ | grep -q '"ok"' \
               && curl -skf --max-time 8 https://localhost/api/scanning/health > /dev/null; then
              echo "✅ Producción saludable (intento $intento)."
              exit 0
            fi
            sleep 10
          done
          echo "❌ Producción no responde sana. Rollback: workflow «TexCore Rollback»."
          exit 1

  # ===========================================================================
  # NOTIFY — resultado del release
  # ===========================================================================
  notify:
    name: "Notificación · resultado del release"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs: [deploy]
    if: always()
    # A nivel de job: el `if` de un paso no ve el `env` de ese mismo paso.
    env:
      WEBHOOK_URL: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK }}
    steps:
      - name: Notificar vía webhook
        if: env.WEBHOOK_URL != ''
        # Los valores llegan por env y el JSON se arma con jq: nada se interpola en el script.
        env:
          RESULTADO: ${{ needs.deploy.result }}
          SHORT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.triggering_actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$RESULTADO" == "success" ]]; then
            emoji="✅"; color="good"; msg="Release desplegado en producción (master)"
          else
            emoji="🚨"; color="danger"; msg="Release NO desplegado ($RESULTADO) — revisar el run"
          fi
          jq -n \
            --arg text "$emoji *TexCore* — $msg" \
            --arg color "$color" \
            --arg sha "${SHORT_SHA:0:8}" \
            --arg actor "$ACTOR" \
            --arg run "$RUN_URL" \
            '{text: $text, attachments: [{color: $color, fields: [
              {title: "Commit", value: $sha, short: true},
              {title: "Rama", value: "master", short: true},
              {title: "Actor", value: $actor, short: true},
              {title: "Run", value: $run, short: false}
            ]}]}' \
            | curl -sf -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" --data-binary @-

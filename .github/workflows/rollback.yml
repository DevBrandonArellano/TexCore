# =============================================================================
# TexCore — Rollback Manual de Producción
#
# Workflow de emergencia. Solo ejecutable manualmente desde GitHub Actions UI.
# Solo miembros con acceso al environment "production" pueden ejecutarlo.
#
# Cuándo usar:
#   · Deploy a master causó regresión o error crítico en producción
#   · La verificación de salud del release falló
#
# Uso:
#   1. Actions → "TexCore Rollback" → "Run workflow" (rama: master)
#   2. Ingresar SHA del commit al que revertir (o vacío para :backup)
#   3. Escribir "ROLLBACK" en confirmación
#   4. Ingresar motivo (queda en auditoría)
# =============================================================================

name: TexCore Rollback

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: |
          SHA del commit al que revertir.
          Dejar vacío para usar :backup (el deploy inmediatamente anterior).
        required: false
        type: string
      confirm:
        description: "Escribe exactamente ROLLBACK para confirmar"
        required: true
        type: string
      reason:
        description: "Motivo del rollback (registro de auditoría)"
        required: true
        type: string

# Mínimo privilegio: cada job declara solo lo que usa.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/texcore

jobs:
  # ===========================================================================
  # VALIDACIÓN — Verificar confirmación y registrar auditoría
  # ===========================================================================
  validate:
    name: "Validación · Confirmación"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Verificar palabra de confirmación
        # Pasar inputs como env vars evita inyección de shell.
        # Si se interpolara ${{ inputs.confirm }} directo en bash, un valor como
        # `ROLLBACK" ]; exit 0; #` saltaría la validación.
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [[ "$CONFIRM" != "ROLLBACK" ]]; then
            echo "❌ Confirmación inválida."
            echo "   Debes escribir exactamente: ROLLBACK"
            exit 1
          fi
          echo "✅ Confirmación válida."

      - name: Registrar evento de auditoría
        env:
          ACTOR: ${{ github.actor }}
          TARGET_SHA: ${{ github.event.inputs.target_sha }}
          REASON: ${{ github.event.inputs.reason }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "============================================"
          echo "  ROLLBACK PRODUCCIÓN — REGISTRO AUDITORÍA"
          echo "  ISO/IEC 27001 A.12.4 — Registro de eventos"
          echo "============================================"
          echo "  Operador:     $ACTOR"
          echo "  Fecha/Hora:   $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "  SHA objetivo: ${TARGET_SHA:-:backup (deploy anterior)}"
          echo "  Motivo:       $REASON"
          echo "  Run ID:       $RUN_ID"
          echo "  URL:          $RUN_URL"
          echo "============================================"

  # ===========================================================================
  # ROLLBACK — Revertir en servidor de producción
  # ===========================================================================
  execute-rollback:
    name: "Rollback · Revertir Producción"
    # Runner propio del servidor (mismo que el deploy de release.yml): sin SSH.
    runs-on: [self-hosted, texcore-prod]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # docker login + pull de GHCR con GITHUB_TOKEN
    needs: validate
    environment:
      name: production
      url: https://${{ vars.PRODUCCION_HOST }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Autenticar en GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Revertir las 6 imágenes
        # Solo cambia las imágenes: no toca .env.prod ni migra. Las migraciones siguen la
        # política expand/contract (la versión N-1 funciona con el esquema N); si hace falta
        # volver también el esquema, se restaura el respaldo previo al release (GUIA_DESPLIEGUE §4.3).
        env:
          TARGET_SHA: ${{ github.event.inputs.target_sha }}
          TEXCORE_DIR: ${{ vars.TEXCORE_DIR }}
          IDENTIDAD: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@refs/heads/master
        run: |
          set -euo pipefail
          SERVICIOS="db:db backend:backend nginx:nginx printing:printing_service scanning:scanning_service reporting_excel:reporting_excel"
          if [[ -n "$TARGET_SHA" ]]; then
            ETIQUETA="$TARGET_SHA"
            echo "==> Rollback a ${ETIQUETA:0:8}: verificando firma y descargando"
            for par in $SERVICIOS; do
              referencia="${IMAGE_BASE}/${par#*:}:${ETIQUETA}"
              cosign verify --certificate-identity "$IDENTIDAD" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com "$referencia" > /dev/null
              docker pull -q "$referencia"
            done
          else
            ETIQUETA="backup"
            echo "==> Rollback a :backup (las imágenes que corrían antes del último release)"
            for par in $SERVICIOS; do
              docker image inspect "${IMAGE_BASE}/${par#*:}:backup" > /dev/null \
                || { echo "❌ No existe ${IMAGE_BASE}/${par#*:}:backup. Usa un SHA concreto."; exit 1; }
            done
          fi

          # Imágenes de la etiqueta elegida; nginx con los certificados del servidor.
          OVERRIDE="$(mktemp --suffix=.yml)"
          {
            echo "services:"
            for par in $SERVICIOS; do
              printf '  %s:\n    image: %s\n' "${par%%:*}" "${IMAGE_BASE}/${par#*:}:${ETIQUETA}"
              if [[ "${par%%:*}" == "nginx" ]]; then
                printf '    volumes: !override\n      - %s/nginx/certs:/etc/nginx/certs:ro\n      - prod_django_static:/var/www/django_static:ro\n' "$TEXCORE_DIR"
              fi
            done
          } > "$OVERRIDE"
          docker compose -p texcore-prod -f infrastructure/docker/docker-compose.prod.yml -f "$OVERRIDE" \
            --env-file "$TEXCORE_DIR/.env.prod" up -d --wait --wait-timeout 900 --remove-orphans
          rm -f "$OVERRIDE"
          echo "✅ Rollback aplicado. Versión activa: ${ETIQUETA:0:8}"

      - name: Verificar recuperación del servicio
        run: |
          for intento in $(seq 1 12); do
            if curl -skf --max-time 8 https://localhost/api/health/ | grep -q '"ok"'; then
              echo "✅ Servicio recuperado (intento $intento)."
              exit 0
            fi
            sleep 10
          done
          echo "❌ Servicio NO responde tras el rollback. Intervención manual urgente."
          exit 1

  # ===========================================================================
  # NOTIFY — Informar al equipo del rollback
  # ===========================================================================
  notify:
    name: "Notificación · Rollback Ejecutado"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs: [execute-rollback]
    if: always()
    # A nivel de job: el `if` de un paso no ve el `env` de ese mismo paso.
    env:
      WEBHOOK_URL: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK }}

    steps:
      - name: Notificar vía webhook
        if: env.WEBHOOK_URL != ''
        # `reason` y `target_sha` los escribe quien lanza el rollback: llegan por env y el
        # JSON se arma con jq, así un valor con comillas o `$(...)` no ejecuta nada.
        env:
          HEALTH_RESULT: ${{ needs.execute-rollback.result }}
          ACTOR: ${{ github.actor }}
          TARGET_SHA: ${{ github.event.inputs.target_sha }}
          REASON: ${{ github.event.inputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$HEALTH_RESULT" == "success" ]]; then status="Recuperado"; else status="SIN RECUPERAR"; fi
          jq -n \
            --arg text "*TexCore ROLLBACK* ejecutado en producción — $status" \
            --arg actor "$ACTOR" \
            --arg sha "${TARGET_SHA:-backup}" \
            --arg status "$status" \
            --arg reason "$REASON" \
            --arg run "$RUN_URL" \
            '{text: $text, attachments: [{color: "warning", fields: [
              {title: "Operador", value: $actor, short: true},
              {title: "SHA objetivo", value: $sha, short: true},
              {title: "Estado", value: $status, short: true},
              {title: "Motivo", value: $reason, short: false},
              {title: "Run", value: $run, short: false}
            ]}]}' \
            | curl -sf -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" --data-binary @-

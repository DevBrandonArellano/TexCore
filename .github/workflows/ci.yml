# =============================================================================
# TexCore — Integración Continua (CI)
#
# Flujo de ramas (master = producción, staging = integración y pruebas):
#   rama de trabajo ──PR──▶ staging ──PR──▶ master ──▶ producción
#
#   · Las ramas de trabajo son temporales y no llevan CI propio: se validan
#     en el PR hacia staging (abrirlo como draft da feedback en cada push).
#   · master solo acepta PRs desde staging (job branch-policy).
#
# Este workflow corre en:
#   · PR hacia staging     — validación de la rama de trabajo
#   · Push a staging       — estado de la rama de integración tras el merge
#   · PR hacia master      — última barrera antes de producción
#   El push a master no se valida aquí: lo hará release.yml (plan CI/CD, Fase 3),
#   que corre el CI completo antes de construir y desplegar. Hasta entonces el CD
#   sigue sin dispararse automáticamente, igual que hoy.
#
# Estándares:
#   · ISO/IEC 25010  — Calidad del software
#   · ISO/IEC 27001  — Seguridad (SAST, secrets scan, SCA)
#   · OWASP DevSecOps — Shift-left security
#   · Conventional Commits — Trazabilidad
#
# SOLID en el pipeline:
#   · SRP — cada job tiene una única responsabilidad
#   · OCP — jobs parametrizados con env vars y matrix
#   · DIP — jobs de test no dependen del build
# =============================================================================

name: TexCore CI

on:
  push:
    branches: [staging]          # CI corre en cada push a staging
  pull_request:
    branches: [master, staging]  # CI corre en PRs hacia master y staging

# Cancela ejecuciones previas en la misma rama/PR (ahorra minutos de CI)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principio de mínimo privilegio (ISO/IEC 27001 — A.9.4): nada a nivel de
# workflow; cada job declara solo lo que usa.
permissions: {}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  # ===========================================================================
  # WORKFLOWS — el pipeline también es código
  # actionlint: sintaxis, expresiones y shellcheck de cada `run`.
  # zizmor: seguridad de los workflows (acciones sin fijar, inyección por
  # plantillas, permisos excesivos, credenciales persistidas).
  # ===========================================================================
  workflow-lint:
    name: "Workflows · actionlint + zizmor"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar actionlint y zizmor
        run: pip install actionlint-py==1.7.12.25 zizmor==1.30.1

      - name: actionlint
        run: actionlint -color

      - name: zizmor
        # Los audits en línea (commits impostores, acciones con CVE) consultan la API de GitHub.
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format github .github/workflows/

  # ===========================================================================
  # POLÍTICA DE RAMAS — master solo recibe cambios desde staging
  # ===========================================================================
  branch-policy:
    name: "Ramas · master solo acepta PRs desde staging"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    if: github.event_name == 'pull_request' && github.base_ref == 'master'

    steps:
      - name: Verificar rama de origen
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" != "staging" ]]; then
            echo "::error::master solo acepta PRs desde staging (origen: $HEAD_REF)."
            exit 1
          fi
          echo "PR staging → master: correcto."

  # ===========================================================================
  # BACKEND — ANÁLISIS ESTÁTICO Y SEGURIDAD
  # ===========================================================================
  backend-lint:
    name: "Backend · Lint & Análisis Estático"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Crear directorio de reportes
        run: mkdir -p reports

      - name: Instalar herramientas de análisis
        # requirements.txt: el plugin de Django de mypy importa la configuración y los modelos.
        run: |
          pip install -r requirements.txt
          pip install \
            ruff==0.16.10 \
            detect-secrets==1.5.0 \
            mypy==1.15.0 \
            django-stubs==5.2.0 \
            djangorestframework-stubs==3.16.0

      - name: Ruff — lint y seguridad de todo el Python del repo (reglas en pyproject.toml)
        # Reemplaza a flake8 y a bandit (reglas S, ISO/IEC 27001 A.14.2.1) y cubre también los
        # 3 microservicios y scripts/. --output-format=github anota cada hallazgo en el PR.
        run: ruff check --output-format=github .

      - name: Ruff — reporte SARIF
        if: always()
        run: ruff check --output-format=sarif --output-file=reports/ruff.sarif --exit-zero .

      - name: detect-secrets — Prevención de credenciales expuestas
        run: detect-secrets scan --baseline .secrets.baseline

      - name: mypy — Verificación de tipos estáticos (gate; configuración en pyproject.toml)
        # Con los plugins de Django y DRF activos. Bloqueante desde la Fase 2 del plan de
        # CI/CD: el backend pasó de 598 errores (sin plugins) a 0.
        run: mypy --pretty gestion/ inventory/ internal_api/

      - name: Subir reporte Ruff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ruff-sarif
          path: reports/ruff.sarif
          retention-days: 30

  # ===========================================================================
  # SAST — Semgrep (Django, Python, secretos, JWT) en todo el repo
  # Bloquea en severidad ERROR. Los falsos positivos llevan `# nosemgrep: <regla>`
  # con el motivo en la línea anterior. El SARIF completo queda como artefacto.
  # ===========================================================================
  sast-semgrep:
    name: "Seguridad · SAST Semgrep"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar Semgrep
        run: pip install semgrep==1.179.0

      - name: Semgrep — reporte completo (SARIF)
        run: |
          semgrep scan --config p/django --config p/python --config p/secrets --config p/jwt \
            --metrics=off --sarif --output semgrep.sarif .

      - name: Semgrep — gate en severidad ERROR
        run: |
          semgrep scan --config p/django --config p/python --config p/secrets --config p/jwt \
            --metrics=off --severity ERROR --error .

      - name: Subir reporte Semgrep
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 30

  # ===========================================================================
  # BACKEND — TESTS DJANGO (gestion + inventory + internal_api)
  # ===========================================================================
  backend-test:
    name: "Backend · Tests Django (gestion + inventory + internal_api)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: backend-lint

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CI_Pass1234!"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433

    env:
      DJANGO_SETTINGS_MODULE: TexCore.settings_test
      DEBUG: "0"
      SECRET_KEY: "ci-only-not-for-production-use-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      CSRF_TRUSTED_ORIGINS: "http://localhost:3000"
      DB_ENGINE: "mssql"
      DB_NAME: "texcore_ci"
      DB_USER: "sa"
      DB_PASSWORD: "CI_Pass1234!"
      DB_HOST: "localhost"
      DB_PORT: "1433"
      DB_DRIVER: "ODBC Driver 18 for SQL Server"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar ODBC Driver 18 para SQL Server
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] \
            https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod \
            $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -q
          sudo ACCEPT_EULA=Y apt-get install -y -q msodbcsql18

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cargar claves RSA de prueba (INTERNAL_JWT) desde .env.test
        # Las vistas que generan tokens de servicio (reporting_proxy, internal_api)
        # requieren INTERNAL_JWT_PRIVATE_KEY/PUBLIC_KEY. Sin ellas, jwt.encode(RS256)
        # falla y los tests devuelven HTTP 500. Se reutilizan las claves de prueba
        # ya versionadas en .env.test (mismo origen que el harness local).
        run: |
          grep -E '^INTERNAL_JWT_(PRIVATE|PUBLIC)_KEY=' .env.test | while IFS= read -r line; do
            key="${line%%=*}"
            val="${line#*=}"
            val="${val%\"}"; val="${val#\"}"
            echo "${key}=${val}" >> "$GITHUB_ENV"
          done

      - name: Crear directorio de reportes
        run: mkdir -p reports

      - name: Esperar a que SQL Server esté listo
        run: |
          for attempt in $(seq 1 30); do
            if python3 -c "import pyodbc; pyodbc.connect('DRIVER=ODBC Driver 18 for SQL Server;SERVER=localhost,1433;UID=sa;PWD=CI_Pass1234!;Encrypt=yes;TrustServerCertificate=yes;Connection Timeout=3').close()" 2>/dev/null; then
              echo "SQL Server listo (intento $attempt)"; break
            fi
            echo "Intento $attempt/30 — esperando 3s..."; sleep 3
            [ "$attempt" -eq 30 ] && { echo "Timeout: SQL Server no disponible"; exit 1; }
          done

      - name: Ejecutar tests con cobertura — gestion + inventory + internal_api
        run: |
          coverage run --rcfile=.coveragerc manage.py test \
            gestion \
            inventory \
            internal_api \
            --verbosity=2 \
            --failfast


      - name: Verificar umbral mínimo de cobertura (fail_under de .coveragerc — ISO/IEC 25010)
        # Gate bloqueante (plan CI/CD, Fase 2): bajo el umbral, el job falla.
        run: coverage report --rcfile=.coveragerc

      - name: Generar reportes de cobertura (XML + HTML)
        # Se generan aunque el umbral falle, para poder ver qué quedó sin cubrir.
        # --fail-under=0: el umbral ya se evaluó en el paso anterior.
        if: always()
        run: |
          coverage xml --rcfile=.coveragerc --fail-under=0
          coverage html --rcfile=.coveragerc --fail-under=0

      - name: Subir reporte de cobertura XML
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-xml
          path: reports/coverage.xml
          retention-days: 30

      - name: Subir reporte de cobertura HTML
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report-html
          path: reports/coverage_html/
          retention-days: 7

  # ===========================================================================
  # MICROSERVICIO — reporting_excel
  # ===========================================================================
  reporting-excel-test:
    name: "reporting_excel · Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: reporting_excel/requirements.txt

      - name: Instalar dependencias del servicio
        working-directory: reporting_excel
        run: pip install -r requirements.txt

      - name: Instalar dependencias de test
        run: pip install pytest pytest-cov pytest-asyncio

      # Suite completa (unit + integración) en una sola corrida. La cobertura y su
      # umbral salen de reporting_excel/pytest.ini: una sola fuente para local y CI.
      - name: Ejecutar tests del reporting_excel
        working-directory: reporting_excel
        env:
          PYTHONPATH: "."
        run: pytest -v

  # ===========================================================================
  # MICROSERVICIO — printing_service
  # ===========================================================================
  printing-service-test:
    name: "printing_service · Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: printing_service/requirements.txt

      - name: Instalar dependencias del servicio (sin WeasyPrint)
        # Las mismas versiones fijadas que producción, salvo weasyprint: necesita
        # libpango/libcairo del sistema y las pruebas lo reemplazan por un mock.
        # Antes se instalaba una lista armada a mano que se desfasó (faltaba PyJWT).
        working-directory: printing_service
        run: |
          grep -v -i '^weasyprint' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt pytest pytest-cov

      # Suite completa: antes solo corría tests/unit y quedaban fuera las pruebas del
      # middleware JWT y de los cálculos de la nota de venta. Umbral en pytest.ini.
      - name: Ejecutar tests del printing_service
        working-directory: printing_service
        env:
          PYTHONPATH: "."
        run: pytest -v

  # ===========================================================================
  # MICROSERVICIO — scanning_service
  # ===========================================================================
  scanning-service-test:
    name: "scanning_service · Tests con mock de BD"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scanning_service/requirements.txt

      - name: Instalar dependencias del servicio
        # httpx<0.28 requerido: httpx>=0.28 eliminó el parámetro `app=` de Client.__init__
        # que usa starlette.testclient internamente con fastapi==0.109.2 (starlette==0.36.x)
        run: pip install -r scanning_service/requirements.txt

      - name: Ejecutar tests del scanning_service
        working-directory: scanning_service
        env:
          PYTHONPATH: "."
          DJANGO_INTERNAL_URL: "http://mock-django:8000"
          SERVICE_NAME: "scanning_ci"
          SERVICE_SECRET: "ci-test-secret-not-for-production"
          INTERNAL_JWT_PUBLIC_KEY: "ci-test-placeholder"
        # Suite completa; cobertura y umbral en scanning_service/pytest.ini.
        run: pytest -v

  # ===========================================================================
  # AUDITORÍA DE DEPENDENCIAS — SCA (Software Composition Analysis)
  # ISO/IEC 27001 A.12.6.1 — Gestión de vulnerabilidades técnicas
  # ===========================================================================
  dependency-audit:
    name: "Seguridad · Auditoría de Dependencias (SCA)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Crear directorio de reportes
        run: mkdir -p reports

      # Gate bloqueante (plan CI/CD, Fase 2): cualquier CVE conocido en las dependencias
      # de los 4 servicios Python falla el job. Una excepción se agrega con
      # `--ignore-vuln <ID>` y un comentario con el motivo y la fecha en que se revisa.
      - name: pip-audit — Dependencias Python (backend + 3 microservicios)
        run: |
          pip install pip-audit==2.10.1
          status=0
          for req in requirements.txt reporting_excel/requirements.txt \
                     printing_service/requirements.txt scanning_service/requirements.txt; do
            echo "::group::pip-audit $req"
            report="reports/pip-audit-$(dirname "$req" | tr './' '_').json"
            pip-audit -r "$req" --progress-spinner off --format json -o "$report" || status=1
            pip-audit -r "$req" --progress-spinner off || true
            echo "::endgroup::"
          done
          exit "$status"

      # Producción (lo que llega al navegador): bloquea desde severidad moderada.
      - name: npm audit — Dependencias de producción del frontend
        if: always()
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

      # Herramientas de build y pruebas: bloquea solo CRITICAL. Los HIGH conocidos son
      # de la cadena de Tailwind CSS 3 (braces/micromatch/chokidar): no se ejecutan en
      # producción y su arreglo exige migrar a Tailwind 4, tarea registrada en el plan
      # de CI/CD (Fase 2). Se revisa en cada corrida de este job.
      - name: npm audit — Dependencias de desarrollo del frontend
        if: always()
        working-directory: frontend
        run: |
          npm audit --audit-level=high || echo "::warning::Hay vulnerabilidades HIGH en dependencias de desarrollo (ver plan CI/CD, migración a Tailwind 4)."
          npm audit --audit-level=critical

      - name: Subir reporte pip-audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pip-audit-report
          path: reports/pip-audit-*.json
          retention-days: 30

  # ===========================================================================
  # FRONTEND — TypeScript, ESLint, Vitest, Build
  # ===========================================================================
  frontend-test:
    name: "Frontend · Tests React + TypeScript"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: TypeScript — Verificación de tipos estáticos
        run: npx tsc --noEmit

      - name: Vitest — Ejecutar tests unitarios
        run: npx vitest run --reporter=verbose --coverage

      - name: Build de producción — verificar compilación exitosa
        run: npm run build

      - name: Subir artefacto de build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ===========================================================================
  # VALIDACIÓN DOCKER — Build sin push (verifica integridad de imágenes)
  # ===========================================================================
  docker-build-validation:
    name: "Docker · Validación de Build de Imágenes"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Solo en PRs hacia master (última barrera antes de producción) y push a staging
    # Evitar correrlo en cada PR de feature → staging para ahorrar minutos
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.base_ref == 'master')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validar build — Backend (Dockerfile.prod)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile.prod
          push: false
          tags: texcore/backend:ci-validate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validar build — Nginx
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: nginx/Dockerfile
          push: false
          tags: texcore/nginx:ci-validate
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # QUALITY GATE — Barrera final antes de merge
  # Todos los jobs anteriores deben ser exitosos (ISO/IEC 25010 — completitud)
  # ===========================================================================
  quality-gate:
    name: "Quality Gate · Barrera de Calidad"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs:
      - workflow-lint
      - branch-policy
      - backend-lint
      - sast-semgrep
      - backend-test
      - reporting-excel-test
      - printing-service-test
      - scanning-service-test
      - dependency-audit
      - frontend-test
      - docker-build-validation
    if: always()

    steps:
      - name: Evaluar resultados de todos los jobs
        env:
          WORKFLOW_LINT:    ${{ needs.workflow-lint.result }}
          BRANCH_POLICY:    ${{ needs.branch-policy.result }}
          BACKEND_LINT:     ${{ needs.backend-lint.result }}
          SAST_SEMGREP:     ${{ needs.sast-semgrep.result }}
          BACKEND_TEST:     ${{ needs.backend-test.result }}
          REPORTING_TEST:   ${{ needs.reporting-excel-test.result }}
          PRINTING_TEST:    ${{ needs.printing-service-test.result }}
          SCANNING_TEST:    ${{ needs.scanning-service-test.result }}
          DEP_AUDIT:        ${{ needs.dependency-audit.result }}
          FRONTEND_TEST:    ${{ needs.frontend-test.result }}
          DOCKER_VALIDATE:  ${{ needs.docker-build-validation.result }}
        run: |
          echo "========================================"
          echo "  TexCore — Quality Gate Report"
          echo "========================================"
          echo "  Workflows (lint):      $WORKFLOW_LINT"
          echo "  Política de ramas:     $BRANCH_POLICY"
          echo "  Backend Lint:          $BACKEND_LINT"
          echo "  SAST Semgrep:          $SAST_SEMGREP"
          echo "  Backend Tests:         $BACKEND_TEST"
          echo "  reporting_excel Tests: $REPORTING_TEST"
          echo "  printing_service:      $PRINTING_TEST"
          echo "  scanning_service:      $SCANNING_TEST"
          echo "  Dependency Audit:      $DEP_AUDIT"
          echo "  Frontend Tests:        $FRONTEND_TEST"
          echo "  Docker Build Check:    $DOCKER_VALIDATE"
          echo "========================================"

          FAILED=0

          # Jobs bloqueantes — impiden el merge
          for job_result in \
            "$WORKFLOW_LINT" \
            "$BACKEND_LINT" \
            "$SAST_SEMGREP" \
            "$BACKEND_TEST" \
            "$REPORTING_TEST" \
            "$PRINTING_TEST" \
            "$SCANNING_TEST" \
            "$DEP_AUDIT" \
            "$FRONTEND_TEST"; do
            if [[ "$job_result" != "success" ]]; then
              FAILED=1
            fi
          done

          # branch-policy solo corre en PRs hacia master — "skipped" es válido en el resto
          if [[ "$BRANCH_POLICY" != "success" && "$BRANCH_POLICY" != "skipped" ]]; then
            FAILED=1
          fi

          # docker-build-validation solo corre en push o PR a master
          # — "skipped" es resultado válido cuando el job no aplica (staging PRs)
          if [[ "$DOCKER_VALIDATE" != "success" && "$DOCKER_VALIDATE" != "skipped" ]]; then
            FAILED=1
          fi

          if [[ $FAILED -eq 1 ]]; then
            echo ""
            echo "❌ Quality Gate FALLIDO — no se puede fusionar a master/staging"
            exit 1
          fi

          echo ""
          echo "✅ Quality Gate PASADO — todos los checks obligatorios exitosos"

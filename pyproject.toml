# Configuración de herramientas de Python de TexCore.
# Ruff es el linter único (reemplaza a flake8 y bandit). Plan: docs/superpowers/plans/2026-10-05-migracion-ruff.md

[tool.ruff]
line-length = 120
target-version = "py312"
# Raíces de imports propios: las apps de Django y el paquete `src` de cada microservicio.
src = [".", "reporting_excel", "printing_service", "scanning_service"]
# Migraciones generadas por Django: no se editan a mano. Lo demás excluido sale de .gitignore.
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
# --- Etapa 1: paridad con flake8 (pycodestyle + pyflakes) ---
select = [
    "E",  # pycodestyle: errores
    "W",  # pycodestyle: avisos
    "F",  # pyflakes
    # --- Etapa 2: correcciones automáticas seguras ---
    "I",       # isort: orden de imports
    "UP",      # pyupgrade: sintaxis moderna de la versión de Python objetivo
    "RUF100",  # `# noqa` que ya no silencia nada
    "RUF010",  # conversión explícita innecesaria en f-strings
    "RUF022",  # __all__ ordenado
    # --- Etapa 3: reglas que detectan defectos ---
    "B",       # bugbear: bugs probables
    "S",       # bandit: seguridad (reemplaza al bandit del CI)
    "BLE",     # `except Exception` que traga errores
    "DTZ",     # fechas sin zona horaria
    "ASYNC",   # llamadas bloqueantes dentro de `async`
    "FAST",    # FastAPI
    "TRY400",  # logger.error en un except (pierde el stack trace)
    "LOG",     # uso del módulo logging
    "G",       # formato de mensajes de logging
    "T20",     # print
    "RUF059",  # variable desempaquetada sin uso
    # --- Etapa 4: Django, simplificaciones y complejidad ---
    "DJ",      # Django: orden de miembros del modelo y CharField nullable
    "SIM",     # simplificaciones
    "RET",     # returns
    "C4",      # comprensiones
    "PERF",    # rendimiento
    "PTH",     # pathlib en lugar de os.path
    "PIE",     # código innecesario
    "C901",    # complejidad ciclomática
]

# Etapa 5 (14-oct-2026): el espaciado y las líneas en blanco los garantiza `ruff format`,
# así que las reglas E1, E2 y E3 de pycodestyle (que solo existen en preview y que la Etapa 1
# listaba para igualar a flake8) ya no se seleccionan: Ruff documenta que chocan con el
# formateador. `ruff format --check` es el gate de formato, en el CI y en el pre-commit.
# `preview` se queda porque RUF059 todavía es una regla preview; con explicit-preview-rules
# solo se activan las preview seleccionadas de forma explícita, sin cambiar ninguna otra.
preview = true
explicit-preview-rules = true

[tool.ruff.format]
# Ruff 0.16 también formatea los bloques ```python de los Markdown. Aquí no: los documentos
# citan fragmentos sueltos (listas de settings, trozos de función) que no son módulos válidos,
# y el formateador los reescribe cambiando su significado — por ejemplo, una línea de
# INSTALLED_APPS se convierte en una tupla. La documentación se edita a mano.
exclude = ["**/*.md"]
# Valores explícitos para que el formato no dependa de los predeterminados de cada versión.
quote-style = "double"
indent-style = "space"
line-ending = "lf"          # los finales de línea del repositorio son LF (.gitattributes)
docstring-code-format = false

[tool.ruff.lint.mccabe]
# Funciones con más de 15 caminos independientes se dividen (SRP).
max-complexity = 15

[tool.ruff.lint.flake8-bugbear]
# FastAPI declara dependencias como valor por defecto: `Depends(...)` es inmutable por diseño.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
# Scripts sueltos que llaman a django.setup() antes de importar modelos: el import tardío es obligatorio.
"scripts/tests/*.py" = ["E402"]
# Pruebas: `assert` es su mecanismo; las contraseñas y el `random` son datos de fixture;
# los os.path dentro de pruebas async son aserciones, no código del event loop de producción.
"**/tests/**" = ["S101", "S105", "S106", "S107", "S311", "ASYNC240"]
"**/test_*.py" = ["S101", "S105", "S106", "S107", "S311", "ASYNC240"]
"**/tests_*.py" = ["S101", "S105", "S106", "S107", "S311"]
"**/conftest.py" = ["S101", "S105", "S106"]
# Generadores de datos de demo y de carga: `random` no es criptografía y las contraseñas son de
# usuarios de prueba locales (nunca se ejecutan en producción, que usa seed_production_masters).
"gestion/management/commands/stress_*.py" = ["S311", "S106"]
"gestion/management/commands/seed_data.py" = ["S105"]
"gestion/management/commands/load_million.py" = ["S311"]
"gestion/management/commands/simular_operacion.py" = ["S105", "S106", "S311"]
"scripts/loadtest/**" = ["S311", "S105"]
# Generador de evidencia: ejecuta herramientas locales (git, npx, pytest) con argumentos fijos y
# lee el XML de JUnit que acaba de producir; no recibe entrada externa.
"scripts/evidencia/**" = ["S314", "S603", "S607"]
# Scripts de consola: imprimir es su salida.
"scripts/**" = ["T201", "BLE001"]
"docs/**/*.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "TexCore.settings_test_local"

repos:
  # --------------------------------------------------------------------------
  # Checks generales de archivos
  # --------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # --------------------------------------------------------------------------
  # Python — Ruff (linter único y reglas de seguridad S, que reemplazan a bandit;
  # reglas en pyproject.toml, igual que el CI)
  # Plan: docs/superpowers/plans/2026-10-05-migracion-ruff.md
  # --------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      # El formato lo decide `ruff format` (Etapa 5): el mismo gate que corre el CI.
      - id: ruff-format

  # --------------------------------------------------------------------------
  # Secrets — Prevenir commits con claves o credenciales hardcodeadas
  # Las exclusiones viven en los filtros de .secrets.baseline (una sola fuente, igual que el
  # CI). Regenerar la línea base (solo archivos versionados) y auditar cada hallazgo:
  #   detect-secrets scan --exclude-files '^(docs.gestion-proyecto.evidencia.junit|scripts.loadtest.resultados|graphify-out|frontend.dist).|(^|.)(package-lock[.]json|[.]secrets[.]baseline)$|[.]lock$|requirements[^/]*[.]txt$' > .secrets.baseline
  #   detect-secrets audit .secrets.baseline   # el CI exige is_secret: false en todos
  # En Windows, regenerarla con PYTHONUTF8=1: sin eso detect-secrets lee los archivos en cp1252,
  # las líneas con tildes o eñes cambian de hash y el gate falla en el CI (Linux).
  # --------------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  # --------------------------------------------------------------------------
  # Conventional Commits — Estandariza mensajes de commit
  # Formato: tipo(scope): descripción
  # Tipos válidos: feat, fix, docs, style, refactor, test, chore, ci, perf
  # --------------------------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - test
          - chore
          - ci
          - perf
          - revert

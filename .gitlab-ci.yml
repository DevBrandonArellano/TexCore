# =============================================================================
# TEXCORE — PIPELINE DE GITLAB CI (plataforma principal; GitHub es solo un espejo)
# La tesis (§5.3) lo define así: integración y análisis estático → pruebas con base de datos
# efímera → construcción de imágenes hacia el GitLab Container Registry → staging →
# producción con rollback manual de un clic. Decisión: docs/arquitectura/ADR/ADR_014.
# Guía de instalación y variables: docs/arquitectura/GUIA_GITLAB.md.
#
# Runners (infrastructure/gitlab/):
#   sin etiqueta  texcore-ci       lint, pruebas, auditoría y escaneo; sin socket de Docker
#   staging       texcore-staging  construcción y staging efímero; solo ramas protegidas
#   produccion    texcore-produccion  en la VM de producción (ejecutor shell); solo master
#
# Variables (Settings > CI/CD > Variables; las secretas, protegidas y enmascaradas):
#   COSIGN_PRIVATE_KEY (archivo) y COSIGN_PASSWORD · GITLAB_CA_CRT (archivo, CA del servidor)
#   PRODUCCION_HOST y TEXCORE_DIR · GITLAB_TOKEN (read_api) · DEPLOY_NOTIFY_WEBHOOK (opcional)
# =============================================================================

stages:
  - lint
  - test
  - build
  - scan
  - staging
  - deploy
  - rollback

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

default:
  # Imágenes de los jobs fijadas por digest (nunca `latest`): una actualización es una decisión.
  image: python:3.12-bookworm@sha256:5560e9ab8709f459489e5b8aa696eda8a07ef821e14bb122be62d91234bfa98b
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  GIT_DEPTH: "1"

cache:
  key:
    files:
      - requirements.txt
  paths:
    - .cache/pip

# Integración: ramas y merge requests; si la rama tiene un MR abierto corre el del MR.
.reglas_ci: &reglas_ci
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
    when: never
  - if: $CI_COMMIT_BRANCH

# Claves de cifrado de prueba (RS-19): solo para la suite; no protegen nada real.
.entorno_django_test: &entorno_django_test
  DJANGO_SETTINGS_MODULE: TexCore.settings_test
  DEBUG: "0"
  SECRET_KEY: "ci-only-not-for-production-use-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" # pragma: allowlist secret
  FIELD_ENCRYPTION_KEYS: "XlejxlU-TjcZMY6ub4Qy9Y2sSvQcp17J3DBw0uh6fv8=" # pragma: allowlist secret
  BLIND_INDEX_KEY: "-xCQ08_ZmqAiZIQIPIOegGJZj1XY09_QZJX7LNuqzfM" # pragma: allowlist secret

# La imagen de herramientas (docker, compose, cosign, jq, bash) se construye en el equipo del
# runner: bash infrastructure/gitlab/construir_ci_tools.sh
.imagen_herramientas: &imagen_herramientas
  image: texcore/ci-tools:1

.script_pip_audit: &script_pip_audit
  - pip install pip-audit==2.10.1
  - mkdir -p reports
  - |
    estado=0
    for req in requirements.txt reporting_excel/requirements.txt \
               printing_service/requirements.txt scanning_service/requirements.txt; do
      echo "--- pip-audit $req"
      informe="reports/pip-audit-$(dirname "$req" | tr './' '_').json"
      pip-audit -r "$req" --progress-spinner off --format json -o "$informe" || estado=1
      pip-audit -r "$req" --progress-spinner off || true
    done
    exit "$estado"

.script_npm_audit: &script_npm_audit
  - cd frontend
  - npm audit --omit=dev --audit-level=moderate
  - npm audit --audit-level=high || echo "AVISO - hay vulnerabilidades HIGH en dependencias de desarrollo"
  - npm audit --audit-level=critical

# =============================================================================
# LINT — análisis estático (Build & Linting, §5.3 fase 1)
# =============================================================================

ramas:politica:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
  script:
    - '[ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" = "staging" ] || { echo "master solo acepta MR desde staging (origen $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME)."; exit 1; }'

lint:pipeline:
  stage: lint
  rules: *reglas_ci
  script:
    - pip install yamllint==1.35.1 shellcheck-py==0.11.0.1
    - 'yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .gitlab-ci.yml'
    - python -c "import json; json.load(open('renovate.json'))"
    - shellcheck -S warning scripts/*.sh infrastructure/gitlab/*.sh infrastructure/docker/entrypoint.sh infrastructure/docker/preparar_bd.sh

lint:backend:
  stage: lint
  rules: *reglas_ci
  script:
    - pip install -r requirements.txt ruff==0.16.10 detect-secrets==1.5.0 mypy==1.15.0 django-stubs==5.2.0 djangorestframework-stubs==3.16.0
    - mkdir -p reports
    # Ruff reemplaza a flake8 y bandit (ADR-015): estilo, errores y reglas de seguridad `S`.
    - ruff check --output-format=gitlab --output-file=gl-code-quality-report.json --exit-zero .
    - ruff check .
    - ruff format --check --diff .
    - git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
    - |
      python - <<'PY'
      import json
      import sys
      resultados = json.load(open(".secrets.baseline", encoding="utf-8"))["results"]
      pendientes = [
          f"{archivo}:{h['line_number']}"
          for archivo, hallazgos in resultados.items()
          for h in hallazgos
          if h.get("is_secret") is not False
      ]
      for p in pendientes:
          print(f"Hallazgo sin auditar o marcado como secreto real: {p}")
      sys.exit(1 if pendientes else 0)
      PY
    - mypy --pretty gestion/ inventory/ internal_api/
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
    expire_in: 30 days

lint:istqb:
  stage: lint
  rules: *reglas_ci
  script:
    # Convención de nombres ISTQB y técnicas declaradas en cada archivo de prueba (§5.3, p. 78).
    - python scripts/auditar_convencion_pruebas.py

lint:permisos:
  stage: lint
  rules: *reglas_ci
  variables:
    <<: *entorno_django_test
    DJANGO_SETTINGS_MODULE: TexCore.settings_test_local
  script:
    # RNF-02: cada ruta con su permiso; falla si una ruta es pública fuera de la lista blanca.
    - pip install -r requirements.txt
    - python scripts/auditar_permisos_backend.py > permisos_rutas.csv
  artifacts:
    paths:
      - permisos_rutas.csv
    expire_in: 90 days

sast:semgrep:
  stage: lint
  image:
    name: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    entrypoint: [""]
  rules: *reglas_ci
  cache: []
  script:
    - semgrep scan --config p/django --config p/python --config p/secrets --config p/jwt --metrics=off --gitlab-sast --output gl-sast-report.json .
    - semgrep scan --config p/django --config p/python --config p/secrets --config p/jwt --metrics=off --severity ERROR --error .
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json
    expire_in: 30 days

# =============================================================================
# TEST — base de datos efímera (§5.3 fase 2)
# =============================================================================

test:backend:
  stage: test
  rules: *reglas_ci
  needs: [lint:backend]
  services:
    - name: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
      alias: sqlserver
      variables:
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: "CI_Pass1234!" # pragma: allowlist secret
        MSSQL_PID: "Developer"
  variables:
    <<: *entorno_django_test
    ALLOWED_HOSTS: "localhost,127.0.0.1"
    CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    CSRF_TRUSTED_ORIGINS: "http://localhost:3000"
    DB_ENGINE: "mssql"
    DB_NAME: "texcore_ci"
    DB_USER: "sa"
    DB_PASSWORD: "CI_Pass1234!" # pragma: allowlist secret
    DB_HOST: "sqlserver"
    DB_PORT: "1433"
    DB_DRIVER: "ODBC Driver 18 for SQL Server"
  script:
    - apt-get update -q && apt-get install -y -q --no-install-recommends curl gnupg unixodbc unixodbc-dev
    - curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
    - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/debian/12/prod bookworm main" > /etc/apt/sources.list.d/mssql-release.list
    - apt-get update -q && ACCEPT_EULA=Y apt-get install -y -q --no-install-recommends msodbcsql18
    - pip install -r requirements.txt
    - export INTERNAL_JWT_PRIVATE_KEY="$(grep '^INTERNAL_JWT_PRIVATE_KEY=' .env.test | cut -d= -f2- | sed 's/^"//; s/"$//')"
    - export INTERNAL_JWT_PUBLIC_KEY="$(grep '^INTERNAL_JWT_PUBLIC_KEY=' .env.test | cut -d= -f2- | sed 's/^"//; s/"$//')"
    - mkdir -p reports
    - |
      for intento in $(seq 1 30); do
        if python -c "import pyodbc; pyodbc.connect('DRIVER=ODBC Driver 18 for SQL Server;SERVER=sqlserver,1433;UID=sa;PWD=CI_Pass1234!;Encrypt=yes;TrustServerCertificate=yes;Connection Timeout=3').close()" 2>/dev/null; then
          echo "SQL Server listo (intento $intento)"; break
        fi
        [ "$intento" -eq 30 ] && { echo "SQL Server no responde"; exit 1; }
        sleep 3
      done
    - coverage run --rcfile=.coveragerc manage.py test gestion inventory internal_api --verbosity=2 --failfast
    # El umbral (fail_under) vive en .coveragerc: ISO/IEC 25010 y el 75 % mínimo de la tesis.
    - coverage report --rcfile=.coveragerc
    - coverage xml --rcfile=.coveragerc --fail-under=0
    - coverage html --rcfile=.coveragerc --fail-under=0
  coverage: '/^TOTAL\s+\d+\s+\d+\s+\d+\s+\d+\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    paths:
      - reports/coverage_html/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml
    expire_in: 14 days

test:scanning:
  stage: test
  rules: *reglas_ci
  variables:
    PYTHONPATH: "."
    DJANGO_INTERNAL_URL: "http://mock-django:8000"
    SERVICE_NAME: "scanning_ci"
    SERVICE_SECRET: "ci-test-secret-not-for-production" # pragma: allowlist secret
    INTERNAL_JWT_PUBLIC_KEY: "ci-test-placeholder"
  script:
    - pip install -r scanning_service/requirements.txt
    - cd scanning_service && pytest -v
  coverage: '/Total coverage: (\d+(?:\.\d+)?)%/'

test:printing:
  stage: test
  rules: *reglas_ci
  variables:
    PYTHONPATH: "."
  script:
    - grep -v -i '^weasyprint' printing_service/requirements.txt > printing_service/requirements-ci.txt
    - pip install -r printing_service/requirements-ci.txt pytest pytest-cov
    - cd printing_service && pytest -v
  coverage: '/Total coverage: (\d+(?:\.\d+)?)%/'

test:reporting:
  stage: test
  rules: *reglas_ci
  variables:
    PYTHONPATH: "."
  script:
    - pip install -r reporting_excel/requirements.txt pytest pytest-cov pytest-asyncio
    - cd reporting_excel && pytest -v
  coverage: '/Total coverage: (\d+(?:\.\d+)?)%/'

test:frontend:
  stage: test
  image: node:24-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
  rules: *reglas_ci
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npx tsc --noEmit
    - npm run typecheck:tests
    - npm run lint
    - npx vitest run --coverage
    - npm run build
  coverage: '/All files\s*\|\s*(\d+(?:\.\d+)?)/'
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 7 days

audit:dependencias:
  stage: test
  rules: *reglas_ci
  script: *script_pip_audit
  artifacts:
    when: always
    paths:
      - reports/pip-audit-*.json
    expire_in: 30 days

audit:npm:
  stage: test
  image: node:24-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
  rules: *reglas_ci
  script: *script_npm_audit

# =============================================================================
# BUILD — las 6 imágenes desde cero hacia el GitLab Container Registry (§5.3 fase 3)
# =============================================================================

build:validacion:
  stage: build
  <<: *imagen_herramientas
  tags: [staging]
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
  needs: [lint:backend, test:backend]
  script:
    # Misma construcción que el release, sin publicar: el MR a master llega ya validado.
    - docker build -f infrastructure/docker/Dockerfile.prod -t texcore/backend:ci-validate .
    - docker build -f nginx/Dockerfile -t texcore/nginx:ci-validate .

build:imagenes:
  stage: build
  <<: *imagen_herramientas
  tags: [staging]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  needs:
    - lint:backend
    - lint:istqb
    - lint:permisos
    - sast:semgrep
    - test:backend
    - test:scanning
    - test:printing
    - test:reporting
    - test:frontend
    - audit:dependencias
    - audit:npm
  parallel:
    matrix:
      - SERVICIO: db
        IMAGEN: db
        DOCKERFILE: database/Dockerfile
        CONTEXTO: .
      - SERVICIO: backend
        IMAGEN: backend
        DOCKERFILE: infrastructure/docker/Dockerfile.prod
        CONTEXTO: .
      - SERVICIO: nginx
        IMAGEN: nginx
        DOCKERFILE: nginx/Dockerfile
        CONTEXTO: .
      - SERVICIO: printing
        IMAGEN: printing_service
        DOCKERFILE: printing_service/Dockerfile
        CONTEXTO: printing_service
      - SERVICIO: scanning
        IMAGEN: scanning_service
        DOCKERFILE: scanning_service/Dockerfile
        CONTEXTO: scanning_service
      - SERVICIO: reporting_excel
        IMAGEN: reporting_excel
        DOCKERFILE: reporting_excel/Dockerfile
        CONTEXTO: reporting_excel
  variables:
    SSL_CERT_FILE: $GITLAB_CA_CRT
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - REF="$CI_REGISTRY_IMAGE/$IMAGEN"
    # Desde cero: nada de capas de otra rama; las bases ya van fijadas por digest en los Dockerfile.
    - >
      docker build --no-cache --pull -f "$DOCKERFILE"
      --label "org.opencontainers.image.title=TexCore $IMAGEN"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      -t "$REF:$CI_COMMIT_SHA" -t "$REF:latest" "$CONTEXTO"
    - docker push "$REF:$CI_COMMIT_SHA"
    - docker push "$REF:latest"
    - REFERENCIA="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$REF:$CI_COMMIT_SHA" | grep "^$REF@" | head -n 1)"
    - test -n "$REFERENCIA" || { echo "No se obtuvo el digest de $REF"; exit 1; }
    # Procedencia (predicado SLSA) y firma con el par de claves del proyecto. No hay registro
    # público de transparencia: el servidor es interno (ADR-014).
    - >
      jq -n --arg uri "$CI_PROJECT_URL" --arg sha "$CI_COMMIT_SHA" --arg id "$CI_PIPELINE_URL" --arg ini "$CI_PIPELINE_CREATED_AT"
      '{builder: {id: $id}, buildType: "https://docs.gitlab.com/ee/ci/", invocation: {configSource: {uri: $uri, digest: {sha1: $sha}, entryPoint: ".gitlab-ci.yml"}}, metadata: {buildInvocationId: $id, buildStartedOn: $ini}}'
      > provenance.json
    - cosign attest --yes --key "$COSIGN_PRIVATE_KEY" --tlog-upload=false --type slsaprovenance --predicate provenance.json "$REFERENCIA"
    - cosign sign --yes --key "$COSIGN_PRIVATE_KEY" --tlog-upload=false "$REFERENCIA"
    - echo "$SERVICIO=$REFERENCIA" > "imagen-$SERVICIO.env"
  artifacts:
    paths:
      - imagen-$SERVICIO.env
    expire_in: 90 days

imagenes:unir:
  stage: build
  <<: *imagen_herramientas
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  needs:
    - job: build:imagenes
      artifacts: true
  script:
    # Las 6 imágenes por digest: lo leen scan, staging y deploy.
    - cat imagen-*.env > imagenes.env
    - test "$(wc -l < imagenes.env)" -eq 6 || { echo "Se esperaban 6 imágenes"; cat imagenes.env; exit 1; }
  artifacts:
    paths:
      - imagenes.env
    expire_in: 90 days

# =============================================================================
# SCAN — Trivy sobre cada digest, antes de staging
# =============================================================================

scan:trivy:
  stage: scan
  image:
    name: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  needs:
    - job: imagenes:unir
      artifacts: true
  cache: []
  variables:
    SSL_CERT_FILE: $GITLAB_CA_CRT
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - |
      estado=0
      while IFS='=' read -r servicio referencia; do
        # backend y nginx en modo estricto; db y satélites ignoran lo que aún no tiene parche
        # (los CVE de paquetes base Debian sin corrección publicada no se pueden arreglar).
        opciones="--ignore-unfixed"
        case "$servicio" in backend|nginx) opciones="" ;; esac
        echo "--- Trivy $servicio"
        # shellcheck disable=SC2086
        trivy image --severity CRITICAL,HIGH --exit-code 1 $opciones --format json --output "trivy-$servicio.json" "$referencia" || estado=1
      done < imagenes.env
      exit "$estado"
  artifacts:
    when: always
    paths:
      - trivy-*.json
    expire_in: 30 days

# =============================================================================
# STAGING — las 6 imágenes + SQL Server desechable + pruebas de humo (§5.3 fase 4)
# =============================================================================

staging:efimero:
  stage: staging
  <<: *imagen_herramientas
  tags: [staging]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  needs:
    - job: imagenes:unir
      artifacts: true
    - scan:trivy
  environment:
    name: staging
  variables:
    SSL_CERT_FILE: $GITLAB_CA_CRT
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Levanta, migra desde cero, siembra y prueba; al terminar borra todo. Si falla, no se despliega.
    - bash scripts/staging_efimero.sh imagenes.env

# =============================================================================
# DEPLOY — producción, con un clic manual de un Maintainer (§5.3 fase 4)
# =============================================================================

deploy:produccion:
  stage: deploy
  tags: [produccion]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
  allow_failure: false
  needs:
    - job: imagenes:unir
      artifacts: true
    - staging:efimero
  environment:
    name: production
    url: https://$PRODUCCION_HOST
  variables:
    IMAGE_BASE: $CI_REGISTRY_IMAGE
    SSL_CERT_FILE: $GITLAB_CA_CRT
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      while IFS='=' read -r servicio referencia; do
        echo "Verificando la firma de $servicio: $referencia"
        cosign verify --key cosign.pub --insecure-ignore-tlog=true "$referencia" > /dev/null
      done < imagenes.env
    - bash scripts/desplegar_release.sh imagenes.env
    - |
      for intento in $(seq 1 15); do
        if curl -skf --max-time 8 https://localhost/api/health/ | grep -q '"ok"' \
           && curl -skf --max-time 8 https://localhost/api/scanning/health > /dev/null; then
          echo "Producción saludable (intento $intento)."; exit 0
        fi
        sleep 10
      done
      echo "Producción no responde sana. Rollback: job rollback:produccion de este pipeline."
      exit 1
  after_script:
    - |
      if [ -n "${DEPLOY_NOTIFY_WEBHOOK:-}" ]; then
        jq -n --arg r "$CI_JOB_STATUS" --arg s "$CI_COMMIT_SHORT_SHA" --arg a "$GITLAB_USER_LOGIN" --arg u "$CI_PIPELINE_URL" \
          '{text: ("Despliegue de producción " + $r + " · " + $s + " · " + $a + " · " + $u)}' \
          | curl -sf -X POST -H 'Content-Type: application/json' -d @- "$DEPLOY_NOTIFY_WEBHOOK" || true
      fi

# =============================================================================
# ROLLBACK — reversión manual en un clic (§5.3 fase 4)
# =============================================================================

rollback:produccion:
  stage: rollback
  tags: [produccion]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
  allow_failure: true
  needs: []
  environment:
    name: production
    url: https://$PRODUCCION_HOST
    action: access
  variables:
    IMAGE_BASE: $CI_REGISTRY_IMAGE
    SSL_CERT_FILE: $GITLAB_CA_CRT
    # Al lanzar el job: ROLLBACK_SHA (opcional; vacío = las imágenes :backup) y ROLLBACK_MOTIVO.
    ROLLBACK_SHA: ""
    ROLLBACK_MOTIVO: "sin motivo indicado"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # El motivo lo escribe una persona: solo se usa como argumento de jq, nunca dentro de un script.
    - |
      jq -n --arg motivo "$ROLLBACK_MOTIVO" --arg sha "$ROLLBACK_SHA" --arg quien "$GITLAB_USER_LOGIN" \
        '{rollback: {motivo: $motivo, sha: $sha, quien: $quien}}'
    - |
      set -eu
      SERVICIOS="db:db backend:backend nginx:nginx printing:printing_service scanning:scanning_service reporting_excel:reporting_excel"
      if [ -n "$ROLLBACK_SHA" ]; then
        ETIQUETA="$ROLLBACK_SHA"
        echo "==> Rollback a ${ETIQUETA}: verificando firma y descargando"
        for par in $SERVICIOS; do
          referencia="${IMAGE_BASE}/${par#*:}:${ETIQUETA}"
          cosign verify --key cosign.pub --insecure-ignore-tlog=true "$referencia" > /dev/null
          docker pull -q "$referencia"
        done
      else
        ETIQUETA="backup"
        echo "==> Rollback a :backup (las imágenes que corrían antes del último release)"
        for par in $SERVICIOS; do
          docker image inspect "${IMAGE_BASE}/${par#*:}:backup" > /dev/null \
            || { echo "No existe ${IMAGE_BASE}/${par#*:}:backup. Usa un SHA concreto."; exit 1; }
        done
      fi
      # Solo cambia las imágenes: no toca .env.prod ni migra. Las migraciones siguen la política
      # expand/contract (la versión N-1 funciona con el esquema N); si hace falta volver también
      # el esquema, se restaura el respaldo previo al release (GUIA_DESPLIEGUE §4.3).
      OVERRIDE="$(mktemp --suffix=.yml)"
      {
        echo "services:"
        for par in $SERVICIOS; do
          printf '  %s:\n    image: %s\n' "${par%%:*}" "${IMAGE_BASE}/${par#*:}:${ETIQUETA}"
          if [ "${par%%:*}" = "nginx" ]; then
            printf '    volumes: !override\n      - %s/nginx/certs:/etc/nginx/certs:ro\n      - prod_django_static:/var/www/django_static:ro\n' "$TEXCORE_DIR"
          fi
        done
      } > "$OVERRIDE"
      docker compose -p texcore-prod -f infrastructure/docker/docker-compose.prod.yml -f "$OVERRIDE" \
        --env-file "$TEXCORE_DIR/.env.prod" up -d --wait --wait-timeout 900 --remove-orphans
      rm -f "$OVERRIDE"
      echo "Rollback aplicado. Versión activa: ${ETIQUETA}"
    - |
      for intento in $(seq 1 12); do
        if curl -skf --max-time 8 https://localhost/api/health/ | grep -q '"ok"'; then
          echo "Servicio recuperado (intento $intento)."; exit 0
        fi
        sleep 10
      done
      echo "El servicio NO responde tras el rollback. Intervención manual urgente."
      exit 1
  after_script:
    - |
      if [ -n "${DEPLOY_NOTIFY_WEBHOOK:-}" ]; then
        jq -n --arg r "$CI_JOB_STATUS" --arg m "$ROLLBACK_MOTIVO" --arg a "$GITLAB_USER_LOGIN" --arg u "$CI_PIPELINE_URL" \
          '{text: ("Rollback de producción " + $r + " · " + $m + " · " + $a + " · " + $u)}' \
          | curl -sf -X POST -H 'Content-Type: application/json' -d @- "$DEPLOY_NOTIFY_WEBHOOK" || true
      fi

# =============================================================================
# PIPELINES PROGRAMADOS (CI/CD > Programaciones): semanal, lunes
# =============================================================================

seguridad:dependencias:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script: *script_pip_audit

seguridad:npm:
  stage: test
  image: node:24-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script: *script_npm_audit

seguridad:contenedores:
  stage: scan
  image:
    name: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  cache: []
  variables:
    SSL_CERT_FILE: $GITLAB_CA_CRT
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - |
      estado=0
      for imagen in db backend nginx printing_service scanning_service reporting_excel; do
        echo "--- Trivy $imagen:latest"
        trivy image --severity CRITICAL,HIGH --exit-code 1 --ignore-unfixed "$CI_REGISTRY_IMAGE/$imagen:latest" || estado=1
      done
      exit "$estado"

gobierno:dora:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    GITLAB_CA_FILE: $GITLAB_CA_CRT
  script:
    # Despliegues de `production` y jobs rollback:produccion de los últimos 28 días.
    - test -n "$GITLAB_TOKEN" || { echo "Falta la variable GITLAB_TOKEN (token de proyecto con read_api)."; exit 1; }
    - python3 scripts/metricas_dora.py "$CI_PROJECT_PATH" --dias 28 | tee metricas_dora.md
  artifacts:
    paths:
      - metricas_dora.md
    expire_in: 90 days

dependencias:renovate:
  stage: test
  image:
    name: renovate/renovate:44.172.0@sha256:c0fb80c42b3e45ab1999f2560ca8af5bc394ed4513a33f32591d62678cb3e3e8
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  cache: []
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_TOKEN: $RENOVATE_TOKEN
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    NODE_EXTRA_CA_CERTS: $GITLAB_CA_CRT
  script:
    - renovate

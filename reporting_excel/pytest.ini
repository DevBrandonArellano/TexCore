[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Umbral de cobertura único para local y CI (98,9 % medido el 2026-10-06; mínimo 90 %, como scanning_service).
addopts = --tb=short --cov=src --cov-report=term-missing --cov-fail-under=90
